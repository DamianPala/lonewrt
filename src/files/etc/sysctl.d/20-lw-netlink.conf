# R44d, D166: nlbwmon asks the kernel for a netlink receive buffer of 524288 bytes. The default
# net.core.rmem_max of 180224 capped it at every start and once failed a dump of connections with
# "No buffer space available", which leaves a gap in the data counters. OpenWrt's sysctl service
# reads this file at boot.
net.core.rmem_max=524288
