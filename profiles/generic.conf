# Generic profile: the template every other profile is checked against, and a working image on its
# own. No secrets here. Copy it to profiles/<name>.conf (git ignores everything but this file),
# change the values, build with `./build.sh <name>`.
# Format: KEY='value' per line, single quotes, no ' inside a value; build.sh parses it, never sources it.
# Every key below must exist in every profile (SPEC R3). Empty is allowed only for WIFI_KEY,
# ROOT_PASSWORD and ROOT_PASSWORD_HASH (build.sh draws a password, SPEC R33), WWAN_*, LTE_BANDS,
# WG_* except WG_ENABLED, TG_*, LOW_BALANCE, HC_PING_URL and SMS_ADMINS.

HOSTNAME='lte-router'
LAN_IP='192.168.1.1'
TIMEZONE='CET-1CEST,M3.5.0,M10.5.0/3'
ZONENAME='Europe/Warsaw'

WIFI_SSID='OpenWrt-LTE'
WIFI_KEY=''
# Change to the country the router runs in before building.
WIFI_COUNTRY='PL'
WIFI_CHANNEL_2G='auto'
WIFI_HTMODE_2G='HT20'
WIFI_CHANNEL_5G='auto'
WIFI_HTMODE_5G='VHT80'

# Root password: either in clear text here (8 to 63 printable ASCII characters; build.sh hashes it,
# SPEC R33b), or as a crypt(3) hash for /etc/shadow, e.g. from `openssl passwd -6`. Set at most one
# of the two; both empty = drawn by build.sh (SPEC R33).
ROOT_PASSWORD=''
ROOT_PASSWORD_HASH=''

# Empty APN: the network assigns one, the operator table is the fallback (SPEC R13a, R13b).
WWAN_APN=''
WWAN_AUTH=''
WWAN_USERNAME=''
WWAN_PASSWORD=''

# LTE bands to lock, comma list (e.g. 1,3,8,20); empty = leave the modem's bands alone (SPEC R11c).
LTE_BANDS=''

# WireGuard: wg0 and the vpn zone exist, the interface stays disabled until set up in LuCI (SPEC R32).
# WG_ADDRESS and WG_ALLOWED_IPS take space-separated CIDR lists.
WG_ENABLED='0'
WG_PRIVATE_KEY=''
WG_ADDRESS=''
WG_PEER_PUBLIC_KEY=''
WG_ENDPOINT_HOST=''
WG_ENDPOINT_PORT=''
WG_ALLOWED_IPS=''
WG_KEEPALIVE=''

# Telegram notifications (SPEC R34 to R38): SMS forwarding, balance alerts and a read-only bot.
# Empty token and chat = no lw-notify service at all. TG_BOT_TOKEN is a secret (from @BotFather);
# TG_CHAT_ID is the owner's chat or group (groups are negative, e.g. -100...). LOW_BALANCE
# (e.g. 7.50, in the currency of the SIM's operator preset, docs/operators.md) turns on the
# weekly balance query on Monday 10:00 and the low-balance alert; it needs the token and the chat
# and does nothing for a SIM whose operator has no preset.
TG_BOT_TOKEN=''
TG_CHAT_ID=''
LOW_BALANCE=''

# Heartbeat (SPEC R42): the ping address of a healthchecks.io check. The router calls it every 5
# minutes; healthchecks.io raises the alarm when the calls stop. A secret like the token. Empty =
# no heartbeat and no cron line.
HC_PING_URL=''

# SMS control (SPEC R46): phone numbers that may send STATUS, REBOOT or HELP to the router's SIM.
# Comma list, each number with an optional + and 6 to 15 digits, no spaces, e.g.
# '+15550100123,15550100456'. Private data. Empty = no SMS control.
SMS_ADMINS=''
# REBOOT by SMS (SPEC R46b): the longest age of the SMS in minutes, and the most restarts by SMS per
# day; positive whole numbers, both required.
SMS_REBOOT_MAX_AGE_MIN='10'
SMS_REBOOT_MAX_PER_DAY='5'

# The name that starts every SMS reply of the router (SPEC R48): "<name>: internet OK ...". Required,
# 1 to 20 characters, letters and digits (ASCII), space and -, starting with a letter or digit.
ROUTER_NAME='Router'

# Seconds without an answer to the pings (every 60 s to 8.8.8.8 and 1.1.1.1) after which the router
# restarts the wwan interface, about 40 s without internet (SPEC R14a). A whole number from 120 to
# 900: below that is under two pings, above it a failure already there at boot could make the whole
# router restart before the interface restart (D79).
LINK_RESTART_AFTER_S='120'
