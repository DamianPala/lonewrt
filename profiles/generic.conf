# Generic profile: the template every other profile is checked against, and a working image on its
# own. No secrets here. Copy it to profiles/<name>.conf (git ignores everything but this file),
# change the values, build with `./build.sh <name>`.
# Format: KEY='value' per line, single quotes, no ' inside a value. Every key must stay in the file.
# docs/profile.md says what each key takes and which may be empty; the notes here are reminders.

HOSTNAME='lte-router'
LAN_IP='192.168.1.1'
# Empty TIMEZONE = the build takes the string of ZONENAME.
TIMEZONE='CET-1CEST,M3.5.0,M10.5.0/3'
ZONENAME='Europe/Warsaw'

WIFI_SSID='OpenWrt-LTE'
# Empty = build.sh draws a password.
WIFI_KEY=''
# The country the router runs in.
WIFI_COUNTRY='PL'
WIFI_CHANNEL_2G='auto'
WIFI_HTMODE_2G='HT20'
WIFI_CHANNEL_5G='auto'
WIFI_HTMODE_5G='VHT80'

# Root password: clear text or a crypt(3) hash, at most one of the two. Both empty = drawn.
ROOT_PASSWORD=''
ROOT_PASSWORD_HASH=''

# Public SSH keys for root, separated by ';'.
SSH_KEYS=''

# Mobile data. Empty APN = the network assigns one. WWAN_PIN: empty for a SIM without a PIN.
WWAN_APN=''
WWAN_AUTH=''
WWAN_USERNAME=''
WWAN_PASSWORD=''
WWAN_PIN=''

# LTE bands to lock, e.g. '1,3,20'. Empty = the modem's bands stay as they are.
LTE_BANDS=''

# WireGuard. With WG_ENABLED='0' the tunnel stays off and the other keys may be empty.
WG_ENABLED='0'
WG_PRIVATE_KEY=''
WG_ADDRESS=''
WG_PEER_PUBLIC_KEY=''
WG_ENDPOINT_HOST=''
WG_ENDPOINT_PORT=''
WG_ALLOWED_IPS=''
WG_KEEPALIVE=''

# Telegram: token and chat both set = SMS forwarding, alerts and the bot. LOW_BALANCE (e.g. '7.50')
# adds the weekly balance check.
TG_BOT_TOKEN=''
TG_CHAT_ID=''
LOW_BALANCE=''

# Heartbeat: the ping address of a healthchecks.io check. Empty = none.
HC_PING_URL=''

# A balance check for an operator the image has no preset for (docs/operators.md). Set all of them
# or none; only OP_SHORT_CODES may stay empty.
OP_MCCMNC=''
OP_NAME=''
OP_CURRENCY=''
OP_BALANCE_QUERY_NUMBER=''
OP_BALANCE_QUERY_TEXT=''
OP_BALANCE_REPLY_FROM=''
OP_BALANCE_REPLY_PATTERN=''
OP_SHORT_CODES=''

# SMS control: the numbers that may send status, reboot or help, e.g. '+15550100123,15550100456'.
# Empty = no SMS control.
SMS_ADMINS=''
# reboot by SMS: the longest age of the SMS in minutes, and the most restarts in 24 hours.
SMS_REBOOT_MAX_AGE_MIN='10'
SMS_REBOOT_MAX_PER_DAY='5'
# The name at the start of the router's SMS replies.
ROUTER_NAME='Router'

# Seconds without an answer to the pings before the mobile connection is restarted, 120 to 900.
LINK_RESTART_AFTER_S='120'

# info or debug. debug is for a test period: it writes more to flash.
LOG_LEVEL='info'
